<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B-Tree Inverted Index Search</title>
  <style>
    :root {
      --bg: radial-gradient(circle at 20% 20%, #1d2b64, #0f1628 45%, #0b0f1a 100%);
      --card: #101828;
      --accent: #5bd1ff;
      --accent-2: #8ef6c9;
      --text: #e8edf5;
      --muted: #9aa4b5;
      --border: rgba(255,255,255,0.07);
      --shadow: 0 15px 40px rgba(0,0,0,0.35);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Inter", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .shell {
      width: min(1100px, 100%);
      background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      backdrop-filter: blur(12px);
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.3px;
    }
    p.sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    form {
      margin: 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      flex: 1 1 320px;
      padding: 14px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91, 209, 255, 0.18);
    }
    button {
      padding: 14px 18px;
      border-radius: var(--radius);
      border: none;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #06101c;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 10px 25px rgba(91, 209, 255, 0.25);
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .results {
      margin-top: 20px;
      display: grid;
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .score {
      color: var(--accent-2);
      font-weight: 700;
      font-size: 14px;
    }
    .doc-id { color: var(--muted); font-size: 13px; margin-left: 8px; }
    .text { margin: 6px 0 4px; line-height: 1.5; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      background: rgba(91, 209, 255, 0.12);
      border: 1px solid rgba(91, 209, 255, 0.35);
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .empty { color: var(--muted); margin-top: 8px; }
    footer { margin-top: 16px; color: var(--muted); font-size: 13px; }
    
    /* Upload Section Styles */
    .upload-section {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 16px;
      background: rgba(91, 209, 255, 0.05);
      border: 1px dashed rgba(91, 209, 255, 0.3);
      border-radius: var(--radius);
    }
    .upload-section input[type="file"] {
      flex: 1 1 200px;
      padding: 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 14px;
    }
    .upload-section button {
      padding: 10px 16px;
      font-size: 14px;
    }
    #show-docs-btn {
      background: linear-gradient(120deg, #8ef6c9, #5bd1ff);
    }
    
    /* Documents List Styles */
    .documents-list {
      margin-bottom: 16px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-height: 300px;
      overflow-y: auto;
    }
    .doc-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .doc-item:last-child { margin-bottom: 0; }
    .doc-name {
      color: var(--accent);
      font-weight: 600;
      font-size: 14px;
    }
    .doc-preview {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }
    .delete-btn {
      background: linear-gradient(120deg, #ff6b6b, #ff8e8e);
      padding: 6px 12px;
      font-size: 12px;
    }
    
    @media (max-width: 640px) {
      h1 { font-size: 22px; }
      button, input[type="text"] { width: 100%; }
    }
    
    /* System Selector Styles */
    .system-selector {
      margin-bottom: 16px;
      padding: 16px;
      background: rgba(142, 246, 201, 0.05);
      border: 1px solid rgba(142, 246, 201, 0.2);
      border-radius: var(--radius);
    }
    .system-selector label {
      display: block;
      margin-bottom: 10px;
      color: var(--accent-2);
      font-weight: 600;
      font-size: 14px;
    }
    .system-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .system-option {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 13px;
    }
    .system-option:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .system-option.active {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #06101c;
      border-color: transparent;
      font-weight: 600;
    }
    .system-info {
      margin-top: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .system-name {
      color: var(--accent);
      font-size: 13px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>B-Tree Inverted Index Search</h1>
        <p class="sub">Advanced IR System with multiple retrieval models. Boolean operators supported: AND, OR, NOT</p>
      </div>
    </header>
    
    <!-- Retrieval System Selector -->
    <div class="system-selector">
      <label>🔍 Select Retrieval System:</label>
      <div class="system-options" id="system-options"></div>
      <div class="system-info" id="system-info"></div>
    </div>
    
    <!-- Upload Section -->
    <div class="upload-section">
      <input type="file" id="file-input" accept=".txt,.md,.py,.json,.csv,.html,.xml,.pdf" />
      <button id="upload-btn" type="button">Upload Document</button>
      <button id="show-docs-btn" type="button">Show Documents (<span id="doc-count">0</span>)</button>
    </div>
    
    <form id="search-form">
      <input id="query" type="text" placeholder="e.g. brain AND tumor, information OR retrieval, deep NOT learning" autocomplete="off" />
      <button type="submit">Search</button>
    </form>
    
    <!-- Documents List -->
    <div id="documents-list" class="documents-list" style="display: none;"></div>
    
    <div id="results" class="results"></div>
    <footer>Documents are stored in the /documents folder. Scores sum term frequencies across matched terms.</footer>
  </main>
  <script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('query');
    const resultsEl = document.getElementById('results');
    const systemOptionsEl = document.getElementById('system-options');
    const systemInfoEl = document.getElementById('system-info');
    
    // Current selected system
    let currentSystem = 'tfidf';
    let systemsData = [];
    
    // System descriptions
    const systemDescriptions = {
      'boolean': 'Uses AND, OR, NOT operators. Returns all matching documents without ranking. Example: "brain AND tumor NOT cancer"',
      'tfidf': 'Term Frequency × Inverse Document Frequency. Balances term importance in document vs corpus. Classic ranking method.',
      'bm25': 'Best Matching 25 - State-of-the-art probabilistic model. Used by modern search engines. Handles document length normalization.',
      'probabilistic': 'Binary Independence Model. Based on probability theory. Assumes term independence given relevance.'
    };
    
    // Load available systems
    async function loadSystems() {
      try {
        const res = await fetch('/api/systems');
        const data = await res.json();
        systemsData = data.systems;
        currentSystem = data.default;
        renderSystemOptions();
      } catch (err) {
        console.error('Error loading systems:', err);
      }
    }
    
    function renderSystemOptions() {
      systemOptionsEl.innerHTML = systemsData.map(s => `
        <button type="button" class="system-option ${s.id === currentSystem ? 'active' : ''}" 
                data-system="${s.id}" ${!s.available ? 'disabled' : ''}>
          ${s.id.toUpperCase()}
        </button>
      `).join('');
      
      // Add click handlers
      systemOptionsEl.querySelectorAll('.system-option').forEach(btn => {
        btn.addEventListener('click', () => {
          currentSystem = btn.dataset.system;
          systemOptionsEl.querySelectorAll('.system-option').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          updateSystemInfo();
        });
      });
      
      updateSystemInfo();
    }
    
    function updateSystemInfo() {
      const system = systemsData.find(s => s.id === currentSystem);
      if (system) {
        systemInfoEl.innerHTML = `
          <div class="system-name">${system.name}</div>
          <div>${systemDescriptions[currentSystem] || ''}</div>
        `;
      }
    }
    
    loadSystems();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      resultsEl.innerHTML = '<div class="card">Searching...</div>';
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&system=${currentSystem}`);
        const data = await res.json();
        renderResults(data);
      } catch (err) {
        resultsEl.innerHTML = `<div class="card">Error: ${err}</div>`;
      }
    });

    function renderResults(data) {
      const { results, system_name } = data;
      if (!results.length) {
        resultsEl.innerHTML = '<div class="empty">No documents matched.</div>';
        return;
      }
      
      // Header showing which system was used
      let html = `<div class="card" style="background: rgba(91, 209, 255, 0.1); margin-bottom: 12px;">
        <span style="color: var(--accent);">📊 Results from: ${system_name || currentSystem.toUpperCase()}</span>
        <span style="color: var(--muted); margin-left: 12px;">${results.length} document(s) found</span>
      </div>`;
      
      html += results.map(r => {
        const badges = (r.matches || []).map(m => {
          if (typeof m === 'string') {
            return `<span class="badge">${m}</span>`;
          }
          return `<span class="badge">${m.term} · tf=${m.tf}</span>`;
        }).join('');
        return `
          <div class="card">
            <div><span class="score">score ${r.score}</span><span class="doc-id">${r.doc_id}</span></div>
            <div class="text">${r.text}</div>
            <div class="badges">${badges}</div>
          </div>
        `;
      }).join('');
      
      resultsEl.innerHTML = html;
    }

    // Upload functionality
    const fileInput = document.getElementById('file-input');
    const uploadBtn = document.getElementById('upload-btn');
    const showDocsBtn = document.getElementById('show-docs-btn');
    const docsList = document.getElementById('documents-list');
    const docCount = document.getElementById('doc-count');

    // Load document count on page load
    async function loadDocCount() {
      try {
        const res = await fetch('/api/documents');
        const data = await res.json();
        docCount.textContent = data.total;
      } catch (err) {
        console.error('Error loading docs:', err);
      }
    }
    loadDocCount();

    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        alert('Please select a file first');
        return;
      }
      
      const formData = new FormData();
      formData.append('file', file);
      
      try {
        uploadBtn.textContent = 'Uploading...';
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        if (data.success) {
          alert(`File "${data.filename}" uploaded successfully!`);
          fileInput.value = '';
          docCount.textContent = data.total_docs;
          loadDocuments();
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Upload failed: ' + err);
      } finally {
        uploadBtn.textContent = 'Upload Document';
      }
    });

    showDocsBtn.addEventListener('click', () => {
      if (docsList.style.display === 'none') {
        loadDocuments();
        docsList.style.display = 'block';
      } else {
        docsList.style.display = 'none';
      }
    });

    async function loadDocuments() {
      try {
        const res = await fetch('/api/documents');
        const data = await res.json();
        docCount.textContent = data.total;
        
        if (data.documents.length === 0) {
          docsList.innerHTML = '<div class="empty">No documents yet. Upload some files!</div>';
          return;
        }
        
        docsList.innerHTML = data.documents.map(doc => `
          <div class="doc-item">
            <div>
              <div class="doc-name">${doc.id}</div>
              <div class="doc-preview">${doc.preview}</div>
            </div>
            <button class="delete-btn" onclick="deleteDoc('${doc.id}')">Delete</button>
          </div>
        `).join('');
      } catch (err) {
        docsList.innerHTML = `<div class="empty">Error loading documents: ${err}</div>`;
      }
    }

    async function deleteDoc(docId) {
      if (!confirm(`Delete "${docId}"?`)) return;
      
      try {
        const res = await fetch(`/api/delete/${docId}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          loadDocuments();
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Delete failed: ' + err);
      }
    }
  </script>
</body>
</html>
